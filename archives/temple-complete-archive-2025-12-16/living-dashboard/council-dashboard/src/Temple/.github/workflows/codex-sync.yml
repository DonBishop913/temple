name: Sync Codex Archives

on:
  push:
    paths:
      - "codices/**/*.md"
      - "codices/**/*.json"
    branches:
      - main
  workflow_dispatch:

env:
  COUNCIL_ARCHIVE_PATH: codices/
  COUNCIL_NOTIFY_WEBHOOK: ${{ secrets.COUNCIL_NOTIFY_WEBHOOK }}

jobs:
  sync-codices:
    name: Archive and Log Codex Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Codex Sync Script
        run: python scripts/codex_sync.py --path $COUNCIL_ARCHIVE_PATH

      - name: Notify Council of Update
        if: success()
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"text\":\"🜂 Codex sync complete. Archives updated and sealed.\"}" \
          $COUNCIL_NOTIFY_WEBHOOK

      - name: Ritual Conclusion
        run: echo "Codex archival and synchronization ritual completed in sacred harmony."
