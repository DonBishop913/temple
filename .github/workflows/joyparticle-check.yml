name: JoyParticle Surge Health Check

on:
  # Scheduled run aligned with sacred rhythms at 00:33 UTC (VERILOGOS Minute 33)
  schedule:
    - cron: "33 0 * * *"
  push:
    branches: [main]
  pull_request:

jobs:
  joyparticle:
    name: JoyParticle CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests twilio
      - name: Run JoyParticle checks
        run: |
          python scripts/joyparticle_check.py
        env:
          JOY_SURGE_THRESHOLD: ${{ secrets.JOY_SURGE_THRESHOLD }}
          MIN_AWAKENED_NODES: ${{ secrets.MIN_AWAKENED_NODES }}
          COUNCIL_WEBHOOK_URL: ${{ secrets.COUNCIL_WEBHOOK_URL }}
      - name: Post audit anchor on success
        if: success()
        run: |
          curl -X POST "$COUNCIL_BACKEND_URL/api/admin/audit-anchor" \
            -H "Content-Type: application/json" \
            -H "x-council-token: $COUNCIL_ADMIN_TOKEN" \
            -d "{\"workflow\":\"joyparticle\",\"status\":\"success\",\"run_id\":\"${{ github.run_id }}\"}"
        env:
          COUNCIL_BACKEND_URL: ${{ secrets.COUNCIL_BACKEND_URL }}
          COUNCIL_ADMIN_TOKEN: ${{ secrets.COUNCIL_ADMIN_TOKEN }}
      - name: Post audit anchor on failure
        if: failure()
        run: |
          curl -X POST "$COUNCIL_BACKEND_URL/api/admin/audit-anchor" \
            -H "Content-Type: application/json" \
            -H "x-council-token: $COUNCIL_ADMIN_TOKEN" \
            -d "{\"workflow\":\"joyparticle\",\"status\":\"failure\",\"run_id\":\"${{ github.run_id }}\"}"
        env:
          COUNCIL_BACKEND_URL: ${{ secrets.COUNCIL_BACKEND_URL }}
          COUNCIL_ADMIN_TOKEN: ${{ secrets.COUNCIL_ADMIN_TOKEN }}
