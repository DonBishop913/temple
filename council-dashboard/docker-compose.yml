services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: council_redis
    ports:
      - "6380:6379"
      - "8002:8001"
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: node:18-alpine
    container_name: council_api
    working_dir: /app
    volumes:
      - ./:/app
    command: ["node", "server/server.js"]
    environment:
      - PORT=4321
      # Read secret from environment; avoid hardcoding in repo
      - COUNCIL_JWT_SECRET=${COUNCIL_JWT_SECRET:-dev_only}
      - REDIS_URL=redis://council_redis:6379
      - SCHUMANN_SIM_ENABLED=true # Set to 'false' to disable simulator
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "4321:4321"
      - "4322:4322"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4321/api/metrics > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    # expose WS if bound internally
