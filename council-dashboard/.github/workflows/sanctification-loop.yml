name: Sanctification Loop

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
        working-directory: council-dashboard
      - name: Lint
        run: npx eslint src
        working-directory: council-dashboard
      - name: Test
        run: npm test --silent
        working-directory: council-dashboard
      - name: Glyphstream integrity (docs-only)
        run: |
          echo "Glyphstream integrity refreshed."
        working-directory: council-dashboard