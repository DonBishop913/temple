name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install


      - name: Run Lint (fail on error)
        run: npm run lint

      - name: Unit/Integration Tests (fail on error)
        run: npm test -- --coverage

      - name: Start Redis (Docker)
        run: |
          docker run -d --name redis-stack -p 6379:6379 -p 8001:8001 redis/redis-stack-server:latest

      - name: Start Backend API (background)
        run: |
          nohup node server/server.js > api.log 2>&1 &

      - name: Wait for WebSocket readiness
        run: |
          for i in {1..20}; do
            if nc -zv 127.0.0.1 4322; then echo "WS ready"; exit 0; else echo "Waiting WS..."; sleep 1; fi
          done
          echo "WS not ready"; exit 1

      - name: WebSocket Integration Test (node env)
        run: npm run test:node -- src/__tests__/wsIntegration.test.js

      - name: Check Required Env Vars
        run: |
          for var in WS_API_KEY DB_HOST REDIS_URL; do
            if [ -z "${!var}" ]; then echo "Missing env var: $var"; exit 1; fi
          done

      - name: Build
        run: npm run build

      - name: Staging Deploy (optional)
        run: |
          echo "Staging deploy script goes here"

      - name: Automated Smoke Test (optional)
        run: |
          echo "Smoke test script goes here"

      - name: Deploy
        if: ${{ success() }}
        run: |
          echo "Deploy scripts go here"
