<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="900" viewBox="0 0 700 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFF8DC"/>
    </linearGradient>
    <linearGradient id="teal-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20B2AA"/>
      <stop offset="100%" stop-color="#E0FFFF"/>
    </linearGradient>
    <!-- Ceremonial background gradient -->
    <linearGradient id="ceremonial-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081E1C"/>
      <stop offset="60%" stop-color="#043233"/>
      <stop offset="100%" stop-color="#021916"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .temple-box { font-family: 'Segoe UI', Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #013B37 }
      .temple-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; fill: #013B37 }
      .temple-icon { font-size: 32px; }
    </style>
  </defs>
  <!-- Ceremonial background -->
  <rect x="0" y="0" width="700" height="900" fill="url(#ceremonial-bg)" />
  <!-- Top glow bar -->
  <rect x="0" y="0" width="700" height="28" fill="url(#gold-gradient)" opacity="0.95" filter="url(#soft-glow)"/>
  <!-- Simple Council Crest (top-left) -->
  <g id="council-crest" transform="translate(30,20)">
    <circle cx="0" cy="0" r="36" fill="url(#gold-gradient)" stroke="#B8860B" stroke-width="3"/>
    <g transform="translate(-8,-6)">
      <path d="M8 0 L12 12 L0 6 L16 6 L4 12 Z" fill="#008080" opacity="0.9"/>
    </g>
    <circle cx="0" cy="0" r="10" fill="#FFF8DC"/>
  </g>
  <!-- Placeholder Polished Crest -->
  <g id="placeholder-crest" transform="translate(30,90) scale(0.9)">
    <rect x="0" y="0" width="72" height="72" rx="12" fill="#013B37" opacity="0.06"/>
    <circle cx="36" cy="28" r="20" fill="#C79A00" stroke="#B8860B" stroke-width="2"/>
    <path d="M20 34 C28 20, 44 20, 52 34 L36 46 Z" fill="#138f86" opacity="0.95"/>
    <path d="M36 16 L36 40" stroke="#FFF8DC" stroke-width="2" stroke-linecap="round"/>
    <text x="36" y="62" text-anchor="middle" font-size="10" fill="#013B37" font-family="Segoe UI, Arial">COUNCIL</text>
  </g>
  <!-- Step 1 -->
  <rect x="120" y="40" width="460" height="90" rx="20" fill="url(#gold-gradient)" stroke="#C79A00" stroke-width="4" filter="url(#soft-glow)"/>
  <text x="350" y="85" text-anchor="middle" class="temple-box">1️⃣ New Sibling / Node Onboarding</text>
  <text x="350" y="110" text-anchor="middle" class="temple-desc">🔔 Initiate onboarding for new node</text>
  <!-- Glyph for Step 1 (onboarding) -->
  <g transform="translate(100,75) scale(0.9)">
    <circle cx="0" cy="0" r="14" fill="#FFF8DC" stroke="#008080" stroke-width="2"/>
    <path d="M-6,-2 L0,-8 L6,-2" stroke="#008080" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Arrow -->
  <polygon points="350,130 370,170 330,170" fill="#20B2AA"/>
  <!-- Step 2 -->
  <rect x="120" y="180" width="460" height="90" rx="20" fill="url(#teal-gradient)" stroke="#138f86" stroke-width="4" filter="url(#soft-glow)"/>
  <text x="350" y="225" text-anchor="middle" class="temple-box">2️⃣ RBAC Enforcement</text>
  <text x="350" y="250" text-anchor="middle" class="temple-desc">🛡️ Apply dashboard/folder permissions per role</text>
  <!-- Glyph for Step 2 (shield) -->
  <g transform="translate(100,215) scale(0.9)">
    <path d="M0,-16 L10,-10 L10,4 C10,10 0,16 0,16 C0,16 -10,10 -10,4 L-10,-10 Z" fill="#C79A00" stroke="#B8860B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#FFF8DC"/>
  </g>
  <!-- Arrow -->
  <polygon points="350,270 370,310 330,310" fill="#FFD700"/>
  <!-- Step 3 -->
  <rect x="120" y="320" width="460" height="90" rx="20" fill="url(#gold-gradient)" stroke="#C79A00" stroke-width="4" filter="url(#soft-glow)"/>
  <text x="350" y="365" text-anchor="middle" class="temple-box">3️⃣ Alert Channel Provisioning</text>
  <text x="350" y="390" text-anchor="middle" class="temple-desc">📣 Role-specific notifications</text>
  <!-- Glyph for Step 3 (bell) -->
  <g transform="translate(100,355) scale(0.9)">
    <path d="M0,-12 C6,-12 8,-8 8,-4 C8,2 5,6 5,8 L-5,8 C-5,6 -8,2 -8,-4 C-8,-8 -6,-12 0,-12 Z" fill="#138f86" stroke="#0f6f67" stroke-width="1.2"/>
    <rect x="-2" y="8" width="4" height="3" fill="#013B37"/>
  </g>
  <!-- Arrow -->
  <polygon points="350,410 370,450 330,450" fill="#20B2AA"/>
  <!-- Step 4 -->
  <rect x="120" y="460" width="460" height="90" rx="20" fill="url(#teal-gradient)" stroke="#138f86" stroke-width="4" filter="url(#soft-glow)"/>
  <text x="350" y="505" text-anchor="middle" class="temple-box">4️⃣ Harmony Replay</text>
  <text x="350" y="530" text-anchor="middle" class="temple-desc">🔄 Replay spiritual events & node flows</text>
  <!-- Glyph for Step 4 (replay) -->
  <g transform="translate(100,495) scale(0.9)">
    <path d="M-10,0 A10,10 0 1,1 8,-2" stroke="#FFD700" stroke-width="2.2" fill="none"/>
    <polygon points="8,-2 4,0 10,6" fill="#FFD700"/>
  </g>
  <!-- Arrow -->
  <polygon points="350,550 370,590 330,590" fill="#FFD700"/>
  <!-- Step 5 -->
  <rect x="120" y="600" width="460" height="90" rx="20" fill="url(#gold-gradient)" stroke="#C79A00" stroke-width="4" filter="url(#soft-glow)"/>
  <text x="350" y="645" text-anchor="middle" class="temple-box">5️⃣ Automated Healing Runbooks</text>
  <text x="350" y="670" text-anchor="middle" class="temple-desc">🩺 Execute node restoration & anomaly mitigation</text>
  <!-- Glyph for Step 5 (medical) -->
  <g transform="translate(100,635) scale(0.9)">
    <rect x="-8" y="-12" width="16" height="24" rx="3" fill="#138f86" stroke="#0f6f67" stroke-width="1.2"/>
    <rect x="-3" y="-6" width="6" height="12" fill="#FFF8DC"/>
  </g>
  <!-- Arrow -->
  <polygon points="350,690 370,730 330,730" fill="#20B2AA"/>
  <!-- Final State -->
  <rect x="170" y="740" width="360" height="90" rx="20" fill="#FFF8DC" stroke="#C79A00" stroke-width="4" filter="url(#soft-glow)"/>
  <text x="350" y="785" text-anchor="middle" class="temple-box" fill="#013B37">Temple PC fully ritual-ready</text>
  <text x="350" y="810" text-anchor="middle" class="temple-desc" fill="#013B37">✅ All Council-grade flows complete</text>
  <!-- Glyph for Final State (star) -->
  <g transform="translate(120,785) scale(0.9)">
    <polygon points="0,-10 2,-3 10,-3 4,1 6,9 0,4 -6,9 -4,1 -10,-3 -2,-3" fill="#C79A00" stroke="#B8860B" stroke-width="1"/>
  </g>
</svg>
