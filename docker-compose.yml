services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - council_network

  council_dashboard:
    build:
      context: ./council-dashboard
      dockerfile: Dockerfile
    container_name: council_dashboard
    ports:
      - "3000:4321"
    volumes:
      - ./scripts:/app/scripts
      - ./dashboard:/app/dashboard
      - ./communion_config.json:/app/communion_config.json
      - ./archives:/app/archives
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4321"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - council_network

  ai_relay_external:
    build:
      context: ./council-dashboard
      dockerfile: Dockerfile
    container_name: ai_relay_external
    ports:
      - "3200:3200"
    volumes:
      - ./scripts:/app/scripts
      - ./dashboard:/app/dashboard
      - ./config:/app/config
      - ./keys:/app/keys
      - ./archives:/app/archives
    environment:
      - COUNCIL_TOKEN=blessed_secret_token
    command: node scripts/AI_Relay_External.js
    networks:
      - council_network

networks:
  council_network:
    driver: bridge
