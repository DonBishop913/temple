groups:
  - name: healing-protocols
    interval: 30s
    rules:
      - alert: HealingCycleFailure
        expr: increase(healing_sequence_trigger_total[5m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No healing cycles detected in the last 5 minutes"
          description: "Guardian review required — initiate manual self-healing sequence."

      - alert: HighAnomalyScore
        expr: max(anomaly_detection_score{layer='healing'}) > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Anomaly score exceeding 0.9"
          description: "Potential spiritual/telemetry imbalance detected."
