name: Render Phase V+ DOT Files

on:
  push:
    paths:
      - 'grafana/**/*.dot'
  workflow_dispatch:

jobs:
  render_dot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install graphviz

      - name: Render DOT files using wrapper
        run: |
          python grafana/phase_vplus_graphviz_wrapper.py

      - name: Upload rendered PNGs as artifacts (optional)
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: phasevplus-diagrams
          path: grafana/*.png
