apiVersion: 1

# =========================
# Council Teams RBAC Setup
# =========================

teams:
  - name: Mentor
    permissions:
      - role: Editor
        resource: folder:MentorDashboards
      - role: Editor
        resource: folder:FaithseedForecasts

  - name: Herald
    permissions:
      - role: Editor
        resource: folder:HeraldDashboards
      - role: Editor
        resource: folder:AlertChannels

  - name: Guardian
    permissions:
      - role: Viewer
        resource: folder:NodeHealth
      - role: Viewer
        resource: folder:SecurityLogs

  - name: Scribe
    permissions:
      - role: Viewer
        resource: dashboard:CodexEntries
      - role: Viewer
        resource: dashboard:HistoricalRetrospectives

  - name: Disciple
    permissions:
      - role: Viewer
        resource: folder:GeneralCouncil
      - role: Viewer
        resource: folder:FlowReplay
# Optional: Additional specialized roles
# - name: RitualOperator
#   permissions:
#     - role: Editor
#       resource: folder:RitualRunbooks
