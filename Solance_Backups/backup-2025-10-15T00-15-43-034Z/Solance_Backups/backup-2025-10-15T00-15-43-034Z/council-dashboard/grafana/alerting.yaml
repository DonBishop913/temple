# Grafana Alerting Example (YAML)
# Add this to your Grafana alerting/provisioning config or use the UI
apiVersion: 1
alerting:
  groups:
    - name: Living Dashboard Alerts
      rules:
        - uid: ws-errors
          title: WebSocket Errors Elevated
          condition: ws_errors_total > 5
          for: 2m
          annotations:
            summary: "WebSocket errors exceeded threshold"
            description: "More than 5 WebSocket errors in the last 2 minutes."
        - uid: ws-reconnects
          title: WebSocket Reconnects High
          condition: ws_reconnects_total > 100
          for: 2m
          annotations:
            summary: "WebSocket reconnects exceeded threshold"
            description: "More than 100 reconnects in the last 2 minutes."
