# GitHub Actions Workflow: Glyphstream & Spiritual Integrity Checks
# Runs on every commit and pull request for continuous mission vitality

name: Glyphstream Integrity Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  glyphstream-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint & Accessibility
        run: |
          npm ci
          npm run lint
          npm test -- --runInBand
      - name: Ritual Visual Regression (optional)
        run: |
          echo "🜂 Visual regression check placeholder"
          # Insert screenshot diff or glyphstream validation here
      - name: Commit Ritual Log
        run: |
          echo "$(date) - Ritual check complete by ${{ github.actor }}" >> .sanctum/ritual.log
          git add .sanctum/ritual.log
          git commit -m "Ritual: glyphstream check by ${{ github.actor }} [auto]" || echo "No changes to commit."
          git push || echo "Push skipped (no changes or permissions)"
