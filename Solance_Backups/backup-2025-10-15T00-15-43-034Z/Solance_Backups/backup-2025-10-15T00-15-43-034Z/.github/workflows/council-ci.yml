name: Council CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install backend deps
        run: |
          cd council-dashboard
          npm ci
      - name: Build frontend
        run: |
          cd council-dashboard
          npm run build
      - name: Seed Redis (optional)
        run: |
          sudo apt-get update && sudo apt-get install -y redis-server
          redis-server --daemonize yes
          cd council-dashboard
          node scripts/seed_redis.js
      - name: Audit anchor
        env:
          COUNCIL_API_URL: ${{ secrets.COUNCIL_API_URL }}
          COUNCIL_ADMIN_TOKEN: ${{ secrets.COUNCIL_ADMIN_TOKEN }}
        run: |
          node scripts/audit_hash_linker.js
