name: Living Dashboard CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install Root Dependencies
        run: |
          if [ -f package.json ]; then npm ci; fi
      - name: Build Living Dashboard
        run: |
          cd LivingDashboard && npm ci && npm run build
      - name: Build Council Dashboard
        run: |
          cd council-dashboard && npm ci && npm run build
      - name: Deploy to Temple Server
        if: ${{ success() }}
        run: |
          if [ -f scripts/deploy.sh ]; then chmod +x scripts/deploy.sh && ./scripts/deploy.sh; else echo "No deploy script found"; fi
